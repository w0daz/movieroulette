<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MovieRoulette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --accent: #e63946;
      --accent-dark: #c1121f;
      --text: #f0eee9;
      --text-muted: #8a8790;
      --border: #2a2a32;
      --tag-bg: #23232b;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.6);
      --sidebar-collapsed: 28%;
      --sidebar-open: 380px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    .docs-link {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .docs-link:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Two-column layout ── */
    .layout {
      flex: 1;
      display: flex;
    }

    /* ── Left: card area ── */
    .card-area {
      flex: 1;
      padding: 56px 64px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
    }

    /* Empty state (shown before first spin) */
    .empty-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-muted);
      pointer-events: none;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }
    .empty-hint.hidden { opacity: 0; }
    .empty-hint .e-icon { font-size: 3.4rem; opacity: 0.28; margin-bottom: 16px; }
    .empty-hint h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      opacity: 0.33;
      margin-bottom: 8px;
    }
    .empty-hint p { font-size: 0.84rem; opacity: 0.55; white-space: normal; max-width: 260px; margin: 0 auto; }
    .hint-arrow { margin-top: 18px; font-size: 1.4rem; opacity: 0.3; }

    /* Card */
    .card-wrap {
      width: 100%;
      max-width: 680px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .card-wrap.visible { opacity: 1; transform: translateY(0); }

    .movie-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 40px 44px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    .movie-year-director {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .movie-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    .movie-desc {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-muted);
      margin-bottom: 24px;
      font-weight: 300;
    }
    .movie-genres { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .genre-tag {
      padding: 4px 12px;
      border-radius: 4px;
      background: var(--tag-bg);
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .vote-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .vote-label { font-size: 0.78rem; color: var(--text-muted); }
    .vote-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      color: var(--text-muted);
    }
    .vote-btn:hover { border-color: var(--text); color: var(--text); }
    .vote-btn.up:hover { border-color: #2a9d8f; color: #2a9d8f; }
    .vote-btn.down:hover { border-color: var(--accent); color: var(--accent); }
    .vote-btn.voted { opacity: 0.6; pointer-events: none; }
    .vote-count { font-size: 0.82rem; font-weight: 400; }
    .spin-again-btn {
      margin-left: auto;
      padding: 8px 20px;
      border-radius: 6px;
      background: var(--tag-bg);
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .spin-again-btn:hover { background: var(--border); color: var(--text); }

    .poster-img {
      display: block;
      max-height: 300px;
      width: auto;
      border-radius: 8px;
      margin: 0 auto 24px;
    }

    /* ── Right: collapsible sidebar ── */
    .sidebar {
      width: var(--sidebar-collapsed);
      min-width: 220px;
      max-width: var(--sidebar-open);
      transition: width 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      background: var(--surface);
      border-left: 1px solid var(--border);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      align-self: flex-start;
      height: 100vh;
    }
    .sidebar:hover { width: var(--sidebar-open); }

    /* Sidebar content */
    .sidebar-inner {
      width: var(--sidebar-open);
      height: 100%;
      overflow-y: auto;
      padding: 44px 32px 40px;
      container-type: inline-size;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.1rem, 5.6cqi, 2rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      white-space: nowrap;
    }
    .hero-sub {
      font-size: 0.86rem;
      color: var(--text-muted);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .section-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .genre-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .genre-chip {
      padding: 6px 14px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }
    .genre-chip:hover { border-color: var(--accent); color: var(--accent); }
    .genre-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }

    .spin-wrap { display: flex; flex-direction: column; gap: 10px; }
    .spin-btn {
      width: 100%;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s;
    }
    .spin-btn:hover { background: var(--accent-dark); }
    .spin-btn:active { transform: scale(0.98); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spin-btn .btn-icon { margin-right: 8px; display: inline-block; }
    .spin-btn.spinning .btn-icon { animation: spin 0.6s linear; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .clear-btn {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-align: center;
      width: 100%;
    }
    .clear-btn:hover { color: var(--text); }

    /* ── States / shimmer ── */
    .state-msg { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.95rem; }
    .shimmer {
      background: linear-gradient(90deg, #1e1e26 25%, #2a2a35 50%, #1e1e26 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.74rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Mobile ── */
    @media (max-width: 720px) {
      .layout { flex-direction: column-reverse; }
      .sidebar {
        width: 100% !important;
        max-width: 100%;
        min-width: unset;
        height: auto;
        position: static;
        border-left: none;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-inner { width: 100%; padding: 28px 20px 24px; }
      .card-area { padding: 36px 20px 48px; }
      header { padding: 16px 20px; }
      .movie-card { padding: 28px 24px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Movie<span>Roulette</span></div>
  <a class="docs-link" href="/docs" target="_blank">API Docs</a>
</header>

<div class="layout">

  <!-- ── Left: movie card ── -->
  <main class="card-area">
    <div class="empty-hint" id="emptyHint">
      <div class="e-icon">🎬</div>
      <h2>Ready when you are</h2>
      <p>Hover the panel on the right and spin the wheel</p>
      <div class="hint-arrow">⟶</div>
    </div>
    <div class="card-wrap" id="cardWrap">
      <div class="movie-card" id="movieCard"></div>
    </div>
  </main>

  <!-- ── Right: collapsible controls ── -->
  <aside class="sidebar">
    <div class="sidebar-inner">
      <h1 class="hero-title">What should I watch tonight?</h1>
      <p class="hero-sub">Pick some genres, spin the reel — we'll handle the rest.</p>

      <div class="section-label">Pick your mood</div>
      <div class="genre-grid" id="genreGrid">
        <div class="shimmer" style="height:34px;width:72px;border-radius:100px"></div>
        <div class="shimmer" style="height:34px;width:82px;border-radius:100px"></div>
        <div class="shimmer" style="height:34px;width:64px;border-radius:100px"></div>
        <div class="shimmer" style="height:34px;width:90px;border-radius:100px"></div>
      </div>

      <div class="spin-wrap">
        <button class="spin-btn" id="spinBtn" onclick="doSpin()">
          <span class="btn-icon">🎬</span> Spin the reel
        </button>
        <button class="clear-btn" onclick="clearGenres()">Clear selection</button>
      </div>
    </div>
  </aside>

</div>

<footer>MovieRoulette &mdash; for the indecisive cinephile</footer>

<script>
  const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjM2EzZjdjYmUxMTlmMTJiMzMwZTVjNTVmYzhjZjNjNCIsIm5iZiI6MTc3MzYwODIzMS4xMDIwMDAyLCJzdWIiOiI2OWI3MWQyNzUzM2E2N2RmM2EyMWQ3N2EiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.u5g_W_T_Y3LVUgLeE3-NeJsztLpVENN9sDKitBSwqBQ';

  async function fetchPoster(title, year) {
    try {
      const url = `https://api.themoviedb.org/3/search/movie?query=${encodeURIComponent(title)}&year=${year}`;
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${TMDB_TOKEN}` }
      });
      const data = await res.json();
      const path = data.results?.[0]?.poster_path;
      return path ? `https://image.tmdb.org/t/p/w500${path}` : null;
    } catch {
      return null;
    }
  }

  let selectedGenres = new Set();
  let currentMovieId = null;
  let hasVoted = false;

  // ── Load genres ──
  async function loadGenres() {
    const res = await fetch('/api/genres');
    const genres = await res.json();
    const grid = document.getElementById('genreGrid');
    grid.innerHTML = genres.map(g => `
      <button class="genre-chip" data-id="${g.id}" onclick="toggleGenre(this, ${g.id})">${g.name}</button>
    `).join('');
  }

  function toggleGenre(el, id) {
    if (selectedGenres.has(id)) {
      selectedGenres.delete(id);
      el.classList.remove('active');
    } else {
      selectedGenres.add(id);
      el.classList.add('active');
    }
  }

  function clearGenres() {
    selectedGenres.clear();
    document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
  }

  // ── Spin ──
  async function doSpin() {
    const btn = document.getElementById('spinBtn');
    const wrap = document.getElementById('cardWrap');
    const card = document.getElementById('movieCard');

    btn.disabled = true;
    btn.classList.add('spinning');
    hasVoted = false;
    document.getElementById('emptyHint')?.classList.add('hidden');

    card.innerHTML = `<div class="shimmer" style="height:280px;border-radius:8px;margin-bottom:24px"></div>`;
    wrap.classList.remove('visible');
    setTimeout(() => wrap.classList.add('visible'), 30);

    const params = selectedGenres.size > 0
      ? `?genre_ids=${[...selectedGenres].join(',')}`
      : '';

    try {
      const res = await fetch(`/api/movies/spin${params}`);
      const movie = await res.json();

      wrap.classList.remove('visible');
      if (!res.ok) {
        card.innerHTML = `<div class="state-msg">😕 ${movie.error || 'No movies found for your selection.'}</div>`;
        setTimeout(() => wrap.classList.add('visible'), 30);
        return;
      }

      currentMovieId = movie.id;
      await renderCard(movie);

      setTimeout(() => wrap.classList.add('visible'), 30);
    } catch (e) {
      wrap.classList.remove('visible');
      card.innerHTML = `<div class="state-msg">Something went wrong. Try again.</div>`;
      setTimeout(() => wrap.classList.add('visible'), 30);
    } finally {
      btn.disabled = false;
      btn.classList.remove('spinning');
    }
  }

  async function renderCard(movie) {
    const card = document.getElementById('movieCard');
    const posterUrl = await fetchPoster(movie.title, movie.year);
    const genreTags = movie.genres.map(g =>
      `<span class="genre-tag">${g.name}</span>`
    ).join('');

    card.innerHTML = `
      ${posterUrl ? `<img class="poster-img" src="${posterUrl}" alt="Movie poster">` : ''}
      <div class="movie-year-director">${movie.year} &nbsp;·&nbsp; dir. ${movie.director}</div>
      <div class="movie-title">${movie.title}</div>
      <div class="movie-desc">${movie.description}</div>
      <div class="movie-genres">${genreTags}</div>
      <div class="vote-row">
        <span class="vote-label">Rate it:</span>
        <button class="vote-btn up" id="upBtn" onclick="vote('up')">
          👍 <span class="vote-count" id="upCount">${movie.upvotes}</span>
        </button>
        <button class="vote-btn down" id="downBtn" onclick="vote('down')">
          👎 <span class="vote-count" id="downCount">${movie.downvotes}</span>
        </button>
        <button class="spin-again-btn" onclick="doSpin()">Spin again →</button>
      </div>
    `;
  }

  // ── Vote ──
  async function vote(direction) {
    if (hasVoted || !currentMovieId) return;
    hasVoted = true;

    document.getElementById('upBtn').classList.add('voted');
    document.getElementById('downBtn').classList.add('voted');

    const res = await fetch(`/api/movies/${currentMovieId}/vote`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ vote: direction })
    });
    const data = await res.json();
    document.getElementById('upCount').textContent = data.upvotes;
    document.getElementById('downCount').textContent = data.downvotes;
  }

  loadGenres().then(() => doSpin());
</script>
</body>
</html>
